<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- 猫毛球面：光心偏左上，边缘转深形成圆脸体积 -->
    <radialGradient id="cFur" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0"    stop-color="#fef3c7"/>
      <stop offset="0.32" stop-color="#fcd34d"/>
      <stop offset="0.66" stop-color="#f59e0b"/>
      <stop offset="0.88" stop-color="#d97706"/>
      <stop offset="1"    stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="cEarL" gradientUnits="userSpaceOnUse" x1="6" y1="3.2" x2="12.2" y2="12">
      <stop offset="0"   stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1"   stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cEarR" gradientUnits="userSpaceOnUse" x1="26" y1="3.2" x2="19.8" y2="12">
      <stop offset="0"   stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1"   stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="cEarIn" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="12" y2="11">
      <stop offset="0"   stop-color="#fbcfe8"/>
      <stop offset="0.6" stop-color="#f9a8d4"/>
      <stop offset="1"   stop-color="#ec4899"/>
    </linearGradient>
    <!-- 眼睛：虹膜径向 -->
    <radialGradient id="cIris" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0"    stop-color="#bef264"/>
      <stop offset="0.5"  stop-color="#84cc16"/>
      <stop offset="0.85" stop-color="#3f6212"/>
      <stop offset="1"    stop-color="#1a2e05"/>
    </radialGradient>
    <!-- 鼻子 -->
    <linearGradient id="cNose" gradientUnits="userSpaceOnUse" x1="14.8" y1="18.8" x2="17.2" y2="20.5">
      <stop offset="0"   stop-color="#fda4af"/>
      <stop offset="0.6" stop-color="#fb7185"/>
      <stop offset="1"   stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- ═══ 耳朵（先画，根部被头压住） ═══ -->
  <path d="M6.0 3.2 L12.2 8.0 L6.6 12.0 Z" fill="url(#cEarL)" stroke="#1a1a2e" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M7.3 5.6 L10.6 8.3 L7.5 10.4 Z" fill="url(#cEarIn)"/>
  <path d="M26.0 3.2 L19.8 8.0 L25.4 12.0 Z" fill="url(#cEarR)" stroke="#1a1a2e" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M24.7 5.6 L21.4 8.3 L24.5 10.4 Z" fill="url(#cEarIn)" opacity="0.85"/>

  <!-- ═══ 脸 ═══ -->
  <ellipse cx="16" cy="17" rx="11" ry="10" fill="url(#cFur)" stroke="#1a1a2e" stroke-width="1.35"/>
  <!-- 额前虎斑 -->
  <path d="M14.0 8.4 Q 13.3 10.8 14.3 13.0" fill="none" stroke="#c2410c" stroke-width="0.85" stroke-linecap="round" opacity="0.5"/>
  <path d="M16.0 7.8 Q 16.0 10.4 16.0 12.6" fill="none" stroke="#c2410c" stroke-width="0.85" stroke-linecap="round" opacity="0.5"/>
  <path d="M18.0 8.4 Q 18.7 10.8 17.7 13.0" fill="none" stroke="#c2410c" stroke-width="0.85" stroke-linecap="round" opacity="0.5"/>
  <!-- 口鼻区受光块 -->
  <ellipse cx="16" cy="21.2" rx="5.6" ry="4.2" fill="#fffbeb" opacity="0.72"/>
  <!-- 腮红 -->
  <ellipse cx="9.6" cy="21.0" rx="2.3" ry="1.4" fill="#fb7185" opacity="0.28"/>
  <ellipse cx="22.4" cy="21.0" rx="2.3" ry="1.4" fill="#fb7185" opacity="0.28"/>

  <!-- ═══ 眼睛 ═══ -->
  <ellipse cx="11.7" cy="16.4" rx="2.5" ry="3.0" fill="#1a1a2e"/>
  <ellipse cx="11.7" cy="16.4" rx="2.0" ry="2.5" fill="url(#cIris)"/>
  <ellipse cx="11.7" cy="16.4" rx="0.85" ry="2.3" fill="#0f1722"/>
  <circle cx="10.9" cy="15.3" r="0.75" fill="#ffffff"/>
  <circle cx="12.5" cy="17.6" r="0.42" fill="#ffffff" opacity="0.85"/>

  <ellipse cx="20.3" cy="16.4" rx="2.5" ry="3.0" fill="#1a1a2e"/>
  <ellipse cx="20.3" cy="16.4" rx="2.0" ry="2.5" fill="url(#cIris)"/>
  <ellipse cx="20.3" cy="16.4" rx="0.85" ry="2.3" fill="#0f1722"/>
  <circle cx="19.5" cy="15.3" r="0.75" fill="#ffffff"/>
  <circle cx="21.1" cy="17.6" r="0.42" fill="#ffffff" opacity="0.85"/>

  <!-- ═══ 鼻与嘴（ω） ═══ -->
  <path d="M14.8 19.0 L17.2 19.0 Q 17.6 19.0 17.35 19.35 L16.35 20.35 Q 16 20.7 15.65 20.35 L14.65 19.35 Q 14.4 19.0 14.8 19.0 Z"
        fill="url(#cNose)"/>
  <path d="M16 20.5 Q 16 21.9 14.4 21.9 Q 13.25 21.9 13.45 21.05"
        fill="none" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round"/>
  <path d="M16 20.5 Q 16 21.9 17.6 21.9 Q 18.75 21.9 18.55 21.05"
        fill="none" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round"/>

  <!-- ═══ 胡须 ═══ -->
  <path d="M5.6 18.6 L1.4 17.4 M5.4 20.5 L1.1 20.5 M5.7 22.3 L1.7 23.6"
        fill="none" stroke="#1a1a2e" stroke-width="0.6" stroke-linecap="round" opacity="0.75"/>
  <path d="M26.4 18.6 L30.6 17.4 M26.6 20.5 L30.9 20.5 M26.3 22.3 L30.3 23.6"
        fill="none" stroke="#1a1a2e" stroke-width="0.6" stroke-linecap="round" opacity="0.75"/>
</svg>
