<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- 叶面：垂直于主脉的渐变，NE 侧受光、SW 侧背光 -->
    <linearGradient id="lBlade" gradientUnits="userSpaceOnUse" x1="10" y1="22" x2="22" y2="10">
      <stop offset="0"    stop-color="#365314"/>
      <stop offset="0.24" stop-color="#4d7c0f"/>
      <stop offset="0.56" stop-color="#65a30d"/>
      <stop offset="0.82" stop-color="#a3e635"/>
      <stop offset="1"    stop-color="#d9f99d"/>
    </linearGradient>
    <!-- 叶柄 -->
    <linearGradient id="lStem" gradientUnits="userSpaceOnUse" x1="24" y1="28" x2="29" y2="23">
      <stop offset="0"   stop-color="#3f6212"/>
      <stop offset="0.5" stop-color="#65a30d"/>
      <stop offset="1"   stop-color="#4d7c0f"/>
    </linearGradient>
    <!-- 水珠 -->
    <radialGradient id="lDrop" cx="0.36" cy="0.30" r="0.8">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dbeafe"/>
      <stop offset="1"   stop-color="#93c5fd"/>
    </radialGradient>
  </defs>

  <!-- ═══ 叶柄 ═══ -->
  <path d="M24.2 24.2 L29.6 29.6" fill="none" stroke="#1a1a2e" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M24.2 24.2 L29.6 29.6" fill="none" stroke="url(#lStem)" stroke-width="1.3" stroke-linecap="round"/>

  <!-- ═══ 叶片 ═══ -->
  <path d="M7 7 Q 18 9 25 25 Q 9 18 7 7 Z"
        fill="url(#lBlade)" stroke="#1a1a2e" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- NE 叶缘受光亮边 -->
  <path d="M7 7 Q 18 9 25 25" fill="none" stroke="#ecfccb" stroke-width="0.7" opacity="0.75"/>
  <!-- SW 叶缘暗边 -->
  <path d="M7 7 Q 9 18 25 25" fill="none" stroke="#2d460f" stroke-width="0.6" opacity="0.7"/>

  <!-- ═══ 主脉 ═══ -->
  <path d="M7.6 7.6 L24.4 24.4" fill="none" stroke="#ecfccb" stroke-width="0.75" opacity="0.85"/>
  <path d="M8.4 8.4 L23.6 23.6" fill="none" stroke="#3f6212" stroke-width="0.4" opacity="0.45"/>

  <!-- ═══ 侧脉：自中脉分出，走向 NE 叶缘 ═══ -->
  <path d="M11.2 11.2 L12.4 8.9 M14 14 L17 12.5 M17 17 L21.3 17.9 M19.8 19.8 L22.8 20.5"
        fill="none" stroke="#ecfccb" stroke-width="0.5" opacity="0.6" stroke-linecap="round"/>
  <!-- ═══ 侧脉：走向 SW 叶缘 ═══ -->
  <path d="M11.2 11.2 L8.9 12.4 M14 14 L12.5 17 M17 17 L17.9 21.3 M19.8 19.8 L20.5 22.8"
        fill="none" stroke="#2d460f" stroke-width="0.5" opacity="0.45" stroke-linecap="round"/>

  <!-- ═══ 叶面水珠 ═══ -->
  <ellipse cx="16.6" cy="14.6" rx="1.5" ry="1.15" fill="url(#lDrop)" stroke="#3f6212" stroke-width="0.35" opacity="0.95"/>
  <circle cx="16.1" cy="14.2" r="0.36" fill="#ffffff"/>
  <ellipse cx="13.2" cy="18.4" rx="0.95" ry="0.72" fill="url(#lDrop)" stroke="#3f6212" stroke-width="0.3" opacity="0.85"/>
</svg>
